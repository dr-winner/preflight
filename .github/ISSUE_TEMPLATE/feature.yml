name: Feature
description: Propose a capability or change
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One issue maps to one branch and one pull request. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - core
        - mcp
        - db
        - ci
        - docs
    validations:
      required: true
