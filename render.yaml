# Free Render web service. Do not change plan to a paid tier.
services:
  - type: web
    name: preflight-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api start
    envVars:
      - key: NETWORK
        value: testnet
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SELLER_PAY_TO
        sync: false
      - key: X402_API_KEY
        sync: false
      - key: REPORT_SIGNER_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
